apiVersion: v1
kind: Service
metadata:
  name: {{ include "internal-dashboard.fullname" . }}-web
  labels:
    {{- include "internal-dashboard.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.web.service.port }}
      targetPort: {{ .Values.web.service.targetPort }}
      protocol: TCP
  selector:
    {{- include "internal-dashboard.web.selectorLabels" . | nindent 4 }}
