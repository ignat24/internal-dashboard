apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "internal-dashboard.fullname" . }}-api
  labels:
    {{- include "internal-dashboard.labels" . | nindent 4 }}
data:
  APP_MODE: prod
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "internal-dashboard.fullname" . }}-web
  labels:
    {{- include "internal-dashboard.labels" . | nindent 4 }}
data:
  Caddyfile: |
    :80 {
        root * {{ .Values.web.caddyRoot }}
        file_server
    }
