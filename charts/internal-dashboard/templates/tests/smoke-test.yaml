apiVersion: v1
kind: Pod
metadata:
  name: {{ include "internal-dashboard.fullname" . }}-smoke
  labels:
    {{- include "internal-dashboard.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  restartPolicy: Never
  containers:
    - name: curl
      image: curlimages/curl:8.10.1
      resources:
        requests:
          cpu: 25m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
      command: ["sh", "-c"]
      args:
        - |
          set -eu
          base="http://traefik.{{ .Values.networkPolicy.traefikNamespace }}.svc.cluster.local"
          host="{{ .Values.ingress.host }}"
          echo "[1/3] Checking /, /api/, /api/health via Ingress..."
          body="$(curl -fsS -H "Host: ${host}" "${base}/")"
          printf '%s' "${body}" | grep -q "Internal Dashboard"
          body="$(curl -fsS -H "Host: ${host}" "${base}/api/")"
          printf '%s' "${body}" | grep -Eq '"cache"[[:space:]]*:[[:space:]]*"ok"'
          body="$(curl -fsS -H "Host: ${host}" "${base}/api/health")"
          printf '%s' "${body}" | grep -Eq '"status"[[:space:]]*:[[:space:]]*"OK"'
          echo "[2/3] Running concurrency burst (40 requests, 20 parallel)..."
          start="$(date +%s)"
          curl -fsS --parallel --parallel-max 20 --max-time 2 \
            -H "Host: ${host}" -o /dev/null \
            "${base}/api/?req=[1-40]"
          end="$(date +%s)"
          elapsed="$((end - start))"
          echo "Burst finished in ${elapsed}s (limit: 4s)"
          test "${elapsed}" -le 4
          echo "[3/3] Verifying API health after burst..."
          sleep 3
          curl -fsS --max-time 1 -H "Host: ${host}" "${base}/api/health" >/dev/null
          echo "PASS: all smoke and concurrency checks succeeded."
